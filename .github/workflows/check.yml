name: Check the scripts
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: for f in install.sh get.sh scripts/*.sh *.command; do bash -n "$f" || exit 1; done
      - name: ShellCheck (errors only)
        run: shellcheck -S error install.sh get.sh scripts/*.sh
      - name: Python syntax
        run: python3 -m py_compile scripts/*.py
      - name: Config files
        run: |
          python3 -c "import json; json.load(open('config/document-names.json'))"
          grep -q '^https://download.kiwix.org/zim/' config/libraries.txt
          grep -q '^uk | https://' config/pages.txt
      - name: Country config
        run: python3 scripts/check-country.py
      - name: Language files (same keys in every language, every key a page uses exists)
        run: python3 scripts/check-language.py
  served-kit:
    # The harness: the web server against the small test kit, with stand-ins for the AI and the Library
    # server, driven over HTTP and in headless Chrome (tests/). Neither Ollama nor AnythingLLM is needed.
    # Pinned: the kit runs on macOS's own Python 3.9, which newer Ubuntu images no longer offer.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test tools
        run: npm ci
      - name: Served-kit harness
        run: EK_REQUIRE_BROWSER=1 EK_CHROME=$(which google-chrome) python3 -m unittest discover -s tests -v
