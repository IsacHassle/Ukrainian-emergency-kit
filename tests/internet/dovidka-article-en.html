 <h1>Tactical medicine: how to stop bleeding</h1>
 <p>Severe bleeding can kill within minutes. Act at once.</p>
 <h2>Tourniquet</h2>
 <ul><li>Place the tourniquet 10 cm above the wound.</li><li>Tighten until the bleeding stops.</li></ul>
