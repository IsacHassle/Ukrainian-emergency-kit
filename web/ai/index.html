<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<script src="/lib/country.js"></script>
<script src="/lib/lang.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Запитати ШІ · {kit}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-title" content="" data-kit-attr="content={kit}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b5cad">
<link rel="icon" href="/icon-180.png">
<link rel="stylesheet" href="../lib/kit.css">
<style>
  .page { max-width: 760px; }
  .modes { display: flex; gap: 22px; margin: 22px 0 6px; border-bottom: 1px solid var(--line); }
  .mode { cursor: pointer; padding: 8px 0; margin-bottom: -1px; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; }
  .mode input { position: absolute; opacity: 0; pointer-events: none; }
  .mode:has(input:checked) { color: var(--fg); border-bottom-color: var(--fg); }
  .mode:has(input:disabled) { opacity: .4; cursor: not-allowed; }
  .mode:has(input:focus-visible) { outline: 2px solid var(--fg); outline-offset: 2px; }
  #modehint { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
  #status { margin-top: 14px; }
  #fix { color: var(--red); font-size: 14px; margin: 6px 0 0; }
  #log { display: flex; flex-direction: column; gap: 18px; margin: 26px 0 16px; }
  .msg { scroll-margin-top: 16px; overflow-wrap: anywhere; }
  .me { align-self: flex-end; max-width: 85%; white-space: pre-wrap; background: var(--soft); padding: 9px 13px; border-radius: 10px; }
  .me img { display: block; max-width: 220px; max-height: 220px; margin-top: 8px; border-radius: 6px; }
  .ai { padding-left: 14px; border-left: 2px solid var(--line); }
  .ai p, .ai ul, .ai ol { margin: 6px 0; } .ai ul, .ai ol { padding-left: 22px; } .ai li { margin: 3px 0; }
  .ai h4 { margin: 14px 0 4px; font-size: 16px; }
  .ai table { border-collapse: collapse; margin: 8px 0; font-size: 14px; display: block; overflow-x: auto; }
  .ai td, .ai th { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  .meta { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .wait { color: var(--muted); font-size: 15px; }
  .src { margin-top: 10px; font-size: 13.5px; color: var(--muted); }
  .src a, .src span { display: inline-block; margin-right: 12px; color: var(--muted); }
  .sep { font-size: 13px; color: var(--muted); text-align: center; }
  .err { color: var(--red); }
  form#ask { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 14px; border-top: 1px solid var(--line); }
  textarea { width: 100%; resize: vertical; min-height: 64px; }
  .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .row .grow { flex: 1; }
  label.button input { display: none; }
  button.stop { background: var(--red); border-color: var(--red); color: #fff; }
  #thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
  #thumbs div { position: relative; } #thumbs img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }
  #thumbs button { position: absolute; top: -8px; right: -8px; font-size: 12px; padding: 2px 6px; border-radius: 10px; }
  details.more { border-top: 1px solid var(--line); }
  details.more:last-of-type { border-bottom: 1px solid var(--line); }
  details.more > summary { list-style: none; cursor: pointer; padding: 14px 0; display: flex; justify-content: space-between; font-weight: 600; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::after { content: "+"; color: var(--muted); font-weight: 400; }
  details.more[open] > summary::after { content: "–"; }
  details.more > .inner { padding: 0 0 20px; }
  #examples { list-style: none; margin: 0; padding: 0; }
  #examples button { display: block; width: 100%; text-align: left; background: none; color: var(--fg); border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 9px 0; font-size: 15px; }
  #examples button:hover { text-decoration: underline; }
  .guide ol { padding-left: 20px; } .guide ol > li { margin: 10px 0; }
  .guide table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 8px 0; }
  .guide td, .guide th { border-bottom: 1px solid var(--line); padding: 6px 8px 6px 0; text-align: left; vertical-align: top; }
  .example { color: var(--muted); font-size: 15px; margin-top: 4px; }
  @media (max-width: 560px) { .long { display: none; } .modes { gap: 16px; } }
</style>
</head>
<body>
<main class="page">
  <a class="back" href="../">← <span data-kit></span></a>
  <h1 data-t="ai.title"></h1>
  <p class="meta"><span data-t="ai.intro"></span> <span id="danger"></span></p>

  <div id="status" class="lamps"><span data-t="ai.status.checking"></span></div>
  <div id="fix"></div>

  <div class="modes" role="radiogroup" data-t-attr="aria-label:ai.modes.label">
    <label class="mode" data-hint="ai.mode.books.hint"><input type="radio" name="mode" value="books"><span data-t="ai.mode.books"></span></label>
    <label class="mode" data-hint="ai.mode.main.hint"><input type="radio" name="mode" data-model="main" value=""><span data-t="ai.mode.main"></span></label>
    <label class="mode" data-hint="ai.mode.small.hint"><input type="radio" name="mode" data-model="small" value=""><span data-t="ai.mode.small"></span></label>
  </div>
  <p id="modehint"></p>

  <div id="log" aria-live="polite"></div>

  <form id="ask">
    <div id="thumbs"></div>
    <textarea id="q" rows="3" data-t-attr="placeholder:ai.ask.placeholder;aria-label:ai.ask.label"></textarea>
    <div class="row">
      <label class="button plain" data-t-attr="title:ai.photo.attach"><span data-t="ai.photo.button"></span><input id="photo" type="file" accept="image/*" multiple></label>
      <button type="button" class="plain" id="new"><span data-t="ai.new.short"></span><span class="long" data-t="ai.new.long"></span></button>
      <span class="grow"></span>
      <button type="submit" id="send" data-t="ai.send"></button>
    </div>
  </form>

  <section>
    <details class="more"><summary data-t="ai.examples.title"></summary><div class="inner">
      <div id="examples">
        <button type="button" data-t="ai.example.tourniquet"></button>
        <button type="button" data-t="ai.example.mine"></button>
        <button type="button" data-t="ai.example.generator"></button>
        <button type="button" data-t="ai.example.alert"></button>
        <button type="button" data-t="ai.example.burn"></button>
        <button type="button" data-t="ai.example.water"></button>
        <button type="button" data-t="ai.example.cold"></button>
        <button type="button" data-photo="1" data-t="ai.example.photo"></button>
      </div>
    </div></details>
    <details class="more guide"><summary data-t="ai.guide.title"></summary><div class="inner">
      <ol>
        <li><b data-t="ai.guide.mode.head"></b> <span data-t="ai.guide.mode.text"></span></li>
        <li><b data-t="ai.guide.write.head"></b> <span data-t="ai.guide.write.text"></span>
          <div class="example" data-t="ai.guide.write.example"></div></li>
        <li><b data-t="ai.guide.follow.head"></b> <span data-t="ai.guide.follow.text"></span></li>
        <li><b data-t="ai.guide.check.head"></b> <span data-t="ai.guide.check.text"></span></li>
        <li><b data-t="ai.guide.language.head"></b> <span data-t="ai.guide.language.text"></span></li>
        <li><b data-t="ai.guide.photo.head"></b> <span data-t="ai.guide.photo.text"></span></li>
        <li><b data-t="ai.guide.voice.head"></b> <span data-t="ai.guide.voice.text"></span></li>
        <li><b data-t="ai.guide.phone.head"></b> <span data-t="ai.guide.phone.text"></span> <b id="lanurl"></b></li>
        <li><b data-t="ai.guide.broken.head"></b> <span data-t="ai.guide.broken.text"></span></li>
        <li><b data-t="ai.guide.private.head"></b> <span data-t="ai.guide.private.text"></span></li>
      </ol>
      <h3 data-t="ai.other.title"></h3>
      <table>
        <tr><td><span data-t="ai.other.anything"></span> <span data-country="ai.workspace_name"></span></td><td data-t="ai.other.anything.text"></td></tr>
        <tr><td><span data-t="ai.other.ollama"></span> <span data-country="ai.models.main"></span></td><td data-t="ai.other.ollama.text"></td></tr>
        <tr><td data-t="ai.other.terminal"></td><td><code>ollama run <span data-country="ai.models.main"></span></code>, <span data-t="ai.other.terminal.text"></span> <code>/bye</code></td></tr>
      </table>
    </div></details>
  </section>

  <footer class="kit" data-t="ai.footer"></footer>
</main>


<script>
(() => {
  const $ = s => document.querySelector(s);
  const log = $('#log'), q = $('#q'), sendBtn = $('#send'), thumbs = $('#thumbs');
  // The two AI models are named in the country config; a mode is 'books' or the name of its model.
  const MAIN = COUNTRY.ai.models.main, SMALL = COUNTRY.ai.models.small;
  document.querySelectorAll('input[name=mode][data-model]').forEach(i => { i.value = COUNTRY.ai.models[i.dataset.model]; });
  const t = (k, p) => KIT.t(k, p);
  // The three modes' names, in the page language (the glossary: From sources, Quick answer, Save battery).
  const label = m => t(m === 'books' ? 'ai.mode.books' : m === MAIN ? 'ai.mode.main' : 'ai.mode.small');
  // The title follows the page language; the kit's name is filled in by country.js.
  const setTitle = () => { document.documentElement.dataset.title = t('ai.title') + ' · {kit}'; };
  setTitle();
  let KIWIX = `http://${location.hostname}:8090`;   // the libraries (always http); status gives the port in use
  let status = null, mode = null, history = [], photos = [], busy = null;

  // ---------- status ----------
  async function checkStatus() {
    try { status = await (await fetch('/ai-api/status', { cache: 'no-store' })).json(); }
    catch { status = { ollama: false, models: [], books: false, libraries: false }; }
    if (status.library_port) KIWIX = `http://${location.hostname}:${status.library_port}`;
    const avail = { 'books': status.models.includes(MAIN) && (status.books || status.libraries), [MAIN]: status.models.includes(MAIN), [SMALL]: status.models.includes(SMALL) };
    document.querySelectorAll('input[name=mode]').forEach(i => { i.disabled = !avail[i.value]; });
    renderStatus();
    if (status.name || status.lan) $('#lanurl').textContent = [status.name, status.lan].filter(Boolean).map(h => `http://${h}:${status.port}/ai/`).join(t('ai.or'));
    if (!mode || !avail[mode]) {
      const first = ['books', MAIN, SMALL].find(m => avail[m]);
      if (first) setMode(first, true);
    }
  }

  // The lights and the lines on what to fix, from the last status (drawn again when the language changes).
  function renderStatus() {
    if (!status) return;
    const lamp = (on, key) => `<span class="lamp${on ? '' : ' off'}">${esc(t(key))}: ${esc(t(on ? 'ai.status.on' : 'ai.status.off'))}</span>`;
    const s = [lamp(status.ollama, 'ai.status.engine'), lamp(status.books, 'ai.status.books'), lamp(status.libraries, 'ai.status.libraries')], fix = [];
    if (!status.ollama) fix.push(t('ai.fix.engine'));
    if (!status.books) fix.push(t('ai.fix.books'));
    if (!status.libraries) fix.push(t('ai.fix.libraries'));
    const b = status.battery;
    if (b && b.on_battery) {
      s.push(`<span class="lamp warn">${esc(t('ai.status.battery', { percent: b.percent }))}</span>`);
      if (b.percent < 40 && mode !== SMALL) fix.push(t('ai.fix.battery'));
    }
    $('#status').innerHTML = s.join('');
    $('#fix').textContent = fix.join(' ');
  }
  function renderHint() {
    const input = document.querySelector('input[name=mode]:checked');
    $('#modehint').textContent = input ? t(input.closest('label').dataset.hint) : '';
  }
  const renderSend = () => { sendBtn.textContent = t(busy ? 'ai.stop' : 'ai.send'); };
  // The line about danger names the country's main emergency number.
  const renderDanger = () => { $('#danger').textContent = t('ai.danger', { number: COUNTRY.primaryNumber() }); };
  KIT.onChange(() => { setTitle(); renderStatus(); renderHint(); renderSend(); renderDanger(); });
  renderDanger();

  function setMode(m, quiet) {
    const input = document.querySelector(`input[name=mode][value="${m}"]`);
    if (!input || input.disabled) return false;
    input.checked = true;
    renderHint();
    if (mode && mode !== m && log.children.length && !quiet) {
      add('div', 'sep', t('ai.mode.changed', { mode: label(m) }));
    }
    if (mode !== m) history = [];
    mode = m;
    return true;
  }
  document.querySelectorAll('input[name=mode]').forEach(i => i.addEventListener('change', () => setMode(i.value)));

  // ---------- rendering ----------
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g, '$1<i>$2</i>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  function md(src) {
    let out = '', list = null, para = [], table = [];
    const flushP = () => { if (para.length) { out += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } };
    const closeL = () => { if (list) { out += `</${list}>`; list = null; } };
    const flushT = () => {
      if (!table.length) return;
      const rows = table.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r)).map(r => r.trim().replace(/^\||\|$/g, '').split('|'));
      out += '<table>' + rows.map((c, i) => '<tr>' + c.map(x => `<${i ? 'td' : 'th'}>${inline(x.trim())}</${i ? 'td' : 'th'}>`).join('') + '</tr>').join('') + '</table>';
      table = [];
    };
    for (const line of src.split('\n')) {
      let m;
      if (/^\s*\|/.test(line)) { flushP(); closeL(); table.push(line); continue; } else flushT();
      if (!line.trim()) { flushP(); closeL(); continue; }
      if ((m = line.match(/^\s{0,3}#{1,6}\s+(.*)/))) { flushP(); closeL(); out += '<h4>' + inline(m[1]) + '</h4>'; continue; }
      if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { flushP(); if (list !== 'ul') { closeL(); out += '<ul>'; list = 'ul'; } out += '<li>' + inline(m[1]) + '</li>'; continue; }
      if ((m = line.match(/^\s*(\d+)[.)]\s+(.*)/))) { flushP(); if (list !== 'ol') { closeL(); out += `<ol start="${m[1]}">`; list = 'ol'; } out += '<li>' + inline(m[2]) + '</li>'; continue; }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flushP(); closeL(); out += '<hr>'; continue; }
      closeL(); para.push(line);
    }
    flushT(); flushP(); closeL();
    return out;
  }
  // Some models write their reasoning between <think> tags first: hide it.
  const visible = raw => raw.replace(/<think>[\s\S]*?(<\/think>|$)/g, '').replace(/^\s+/, '');

  function add(tag, cls, text) {
    const el = document.createElement(tag);
    el.className = cls;
    if (text != null) el.textContent = text;
    log.appendChild(el);
    el.scrollIntoView({ block: 'end', behavior: 'smooth' });
    return el;
  }

  // ---------- photos ----------
  async function shrink(file) {
    const img = await createImageBitmap(file);
    const k = Math.min(1, 1280 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85);
  }
  function drawThumbs() {
    thumbs.innerHTML = '';
    photos.forEach((p, i) => {
      const d = document.createElement('div');
      d.innerHTML = `<img src="${p}" alt="${esc(t('ai.photo.attached'))}"><button type="button" aria-label="${esc(t('ai.photo.remove'))}">✕</button>`;
      d.querySelector('button').onclick = () => { photos.splice(i, 1); drawThumbs(); };
      thumbs.appendChild(d);
    });
  }
  $('#photo').addEventListener('change', async e => {
    for (const f of [...e.target.files].slice(0, 4 - photos.length)) {
      try { photos.push(await shrink(f)); } catch { alertLine(t('ai.photo.unreadable')); }
    }
    e.target.value = '';
    if (photos.length && mode === 'books') {
      if (setMode(MAIN, true) || setMode(SMALL, true)) add('div', 'sep', t('ai.photo.switched', { mode: label(mode) }));
    }
    drawThumbs();
  });
  const alertLine = t => add('div', 'sep err', t);

  // ---------- asking ----------
  async function readStream(resp, onLine) {
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) { const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if (line) onLine(line); }
    }
    if (buf.trim()) onLine(buf.trim());
  }

  async function ask(text) {
    if (busy || (!text && !photos.length)) return;
    if (!mode) { alertLine(t('ai.none')); return; }
    text = text || t('ai.photo.default');
    const me = add('div', 'msg me', text);
    const imgs = photos.map(p => p.split(',')[1]);
    photos.forEach(p => { const im = document.createElement('img'); im.src = p; im.alt = t('ai.photo.attached'); me.appendChild(im); });
    photos = []; drawThumbs(); q.value = '';

    const box = add('div', 'msg ai');
    const t0 = Date.now(), used = mode;
    let raw = '', sources = [], failed = null, shown = false, doing = used === 'books' ? t('ai.doing.searching') : t('ai.doing.thinking');
    box.innerHTML = `<div class="wait">${esc(doing)}… ${esc(t('ai.seconds', { n: 0 }))}</div>`;
    const tick = setInterval(() => { if (!shown) box.querySelector('.wait').textContent = `${doing}… ${t('ai.seconds', { n: Math.round((Date.now() - t0) / 1000) })}`; }, 1000);
    const paint = () => { const v = visible(raw); if (v) { shown = true; box.innerHTML = md(v); } };

    const ctrl = new AbortController();
    busy = ctrl; sendBtn.className = 'stop'; renderSend();
    try {
      // "From sources" first sends the sources it found (one line), then the answer, like the other modes.
      history.push({ role: 'user', content: text, ...(imgs.length ? { images: imgs } : {}) });
      const books = used === 'books';
      const r = await fetch(books ? '/ai-api/books-chat' : '/ai-api/chat', { method: 'POST', signal: ctrl.signal,
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(books ? { messages: history } : { model: used, messages: history }) });
      if (!r.ok) { history.pop(); throw new Error('ollama'); }
      await readStream(r, line => {
        let d; try { d = JSON.parse(line); } catch { return; }
        if (d.sources) { sources = d.sources; doing = sources.length ? t('ai.doing.reading', { count: sources.length }) : t('ai.doing.thinking'); }
        if (d.error) failed = d.error;
        if (d.message && d.message.content) { raw += d.message.content; paint(); }
      });
      if (raw) history.push({ role: 'assistant', content: visible(raw) });
      else history.pop();
    } catch (e) {
      if (e.name === 'AbortError') failed = 'stopped';
      else failed = t('ai.error.engine');
    } finally {
      clearInterval(tick);
      busy = null; sendBtn.className = ''; renderSend();
    }

    if (!visible(raw)) box.innerHTML = '';
    if (failed === 'stopped') box.insertAdjacentHTML('beforeend', `<div class="meta">${esc(t('ai.stopped'))}</div>`);
    else if (failed) box.insertAdjacentHTML('beforeend', `<div class="err">${esc(String(failed))}</div>`);
    const secs = Math.round((Date.now() - t0) / 1000);
    box.insertAdjacentHTML('beforeend', `<div class="meta">${esc(label(used))} · ${esc(t('ai.seconds', { n: secs }))}</div>`);

    // The kit's books open as PDFs or in the reader; library articles open in Kiwix.
    const seen = new Set(), list = sources.filter(s => s.title && !seen.has(s.title + s.library) && seen.add(s.title + s.library));
    if (list.length) {
      const src = document.createElement('div');
      src.className = 'src';
      src.innerHTML = '<b>' + esc(t('ai.sources')) + '</b> ';
      box.appendChild(src);
      for (const s of list) {
        if (s.href) {
          const a = document.createElement('a');
          a.target = '_blank'; a.href = KIWIX + s.href; a.textContent = `${s.library}: ${s.title}`;
          src.appendChild(a);
          continue;
        }
        const name = s.title.replace(/\.json$/, '');
        let el;
        try {
          const r = await fetch('/ai-api/doc?name=' + encodeURIComponent(name));
          if (r.ok) {
            const href = (await r.json()).href;
            el = document.createElement('a'); el.target = '_blank';
            el.href = /\.(md|txt)$/i.test(href) ? '../las/?f=' + encodeURIComponent(decodeURIComponent(href)) : '../' + href;   // text opens in the reader
          }
        } catch {}
        el = el || document.createElement('span');
        el.textContent = name.replace(/\.(pdf|md)$/i, '');
        src.appendChild(el);
      }
    }
    box.scrollIntoView({ block: 'start', behavior: 'smooth' });   // show the start of the answer
  }

  $('#ask').addEventListener('submit', e => {
    e.preventDefault();
    if (busy) { busy.abort(); return; }
    ask(q.value.trim());
  });
  q.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !matchMedia('(pointer: coarse)').matches) {
      e.preventDefault(); $('#ask').requestSubmit();
    }
  });
  $('#new').addEventListener('click', () => {
    if (busy) busy.abort();
    history = []; photos = []; drawThumbs(); log.innerHTML = ''; q.value = ''; q.focus();
  });
  document.querySelectorAll('#examples button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.photo) { setMode(status && status.models.includes(MAIN) ? MAIN : SMALL); $('#photo').click(); return; }
    q.value = b.textContent; $('#ask').requestSubmit();
  }));

  checkStatus();
  setInterval(() => { if (!busy) checkStatus(); }, 15000);
})();
</script>
</body>
</html>
