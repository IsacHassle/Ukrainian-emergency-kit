<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<script src="/lib/country.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklista · {kit}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#0b5cad">
<link rel="stylesheet" href="../lib/kit.css">
<style>
  .page { max-width: 700px; }
  .progress { height: 4px; background: var(--line); margin: 18px 0 6px; border-radius: 2px; overflow: hidden; }
  .progress div { height: 100%; width: 0; background: var(--fg); transition: width .3s; }
  #count { font-size: 13px; color: var(--muted); margin: 0; }
  h2 { margin-top: 28px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-bottom: 1px solid var(--line); }
  label { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; cursor: pointer; }
  input[type=checkbox] { width: 18px; height: 18px; margin-top: 3px; flex: none; accent-color: var(--fg); }
  li.done span { color: var(--muted); text-decoration: line-through; }
  .src { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  @media print { button, .back { display: none; } }
</style>
</head>
<body>
<main class="page">
  <a class="back" href="/">← <span data-kit></span></a>
  <h1>Checklista för hemberedskap</h1>
  <p class="meta">Bocka av det du har hemma. Målet är att klara dig själv i minst en vecka. Bockarna sparas i den här webbläsaren.</p>
  <div class="progress"><div id="bar"></div></div>
  <p id="count"></p>

  <h2 id="mcfhead"></h2>
  <ul id="mcf"><li><label>Laddar…</label></li></ul>
  <p class="src" id="mcfsrc"></p>

  <h2>Krislådan</h2>
  <ul id="kit"></ul>

  <p style="margin:18px 0 30px; display:flex; gap:8px"><button class="plain" onclick="print()">Skriv ut</button><button class="plain" id="reset">Börja om</button></p>
</main>
<script src="../lib/md.js"></script>
<script>
(() => {
  const KEY = COUNTRY.slug.toLowerCase() + '-checklista';
  let state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
  const KIT = COUNTRY.checklist.additions.map(a => COUNTRY.text(a));   // the country's own items (country config)
  function list(el, items) {
    el.innerHTML = '';
    for (const text of items) {
      const li = document.createElement('li');
      li.innerHTML = '<label><input type="checkbox"><span></span></label>';
      li.querySelector('span').textContent = text;
      const box = li.querySelector('input');
      box.checked = !!state[text]; li.classList.toggle('done', box.checked);
      box.onchange = () => { state[text] = box.checked; li.classList.toggle('done', box.checked); save(); count(); };
      el.appendChild(li);
    }
  }
  function count() {
    const boxes = [...document.querySelectorAll('input[type=checkbox]')];
    const done = boxes.filter(b => b.checked).length;
    document.getElementById('count').textContent = `${done} av ${boxes.length} klart`;
    document.getElementById('bar').style.width = (boxes.length ? 100 * done / boxes.length : 0) + '%';
  }
  const OFFICIAL = COUNTRY.checklist.official_list;
  document.getElementById('mcfhead').textContent = COUNTRY.text(OFFICIAL.heading);
  list(document.getElementById('kit'), KIT);
  // MCF's own list, from the saved page "Grunder i hemberedskap".
  const doc = 'docs/' + COUNTRY.official_guides.folder + '/' + OFFICIAL.guide + '.md';
  fetchDoc(doc).then(t => {
    const part = (t.split(/\n(?=## )/).find(p => p.startsWith('## ' + OFFICIAL.section)) || '');
    const items = part.split('\n').filter(l => /^\s*[-*•]\s+/.test(l)).map(l => l.replace(/^\s*[-*•]\s+/, '').trim());
    if (!items.length) throw new Error('empty');
    list(document.getElementById('mcf'), items);
    const src = (t.match(new RegExp('^' + OFFICIAL.source_prefix + '.*$', 'm')) || [''])[0];
    document.getElementById('mcfsrc').textContent = src + ' Mer om vatten, mat och värme: se Svenska myndigheters råd på startsidan.';
    count();
  }).catch(() => {
    document.getElementById('mcf').innerHTML = '<li><label>MCF:s checklista saknas. Kör installationen igen med internet.</label></li>';
    count();
  });
  document.getElementById('reset').onclick = () => { state = {}; save(); location.reload(); };
  count();
})();
</script>
</body>
</html>
