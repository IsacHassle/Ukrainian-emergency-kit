<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<script src="/lib/country.js"></script>
<script src="/lib/lang.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мапа · {kit}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-title" content="" data-kit-attr="content={kit}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b5cad">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%97%BA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<link rel="stylesheet" href="../lib/kit.css">
<style>
  html, body { margin: 0; height: 100%; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 2; width: 360px; max-width: calc(100vw - 70px);
    background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08); font-size: 14px; padding: 12px;
  }
  #panel .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  #panel .head a { color: var(--muted); text-decoration: none; font-size: 13px; }
  #panel .head b { font-size: 17px; font-weight: 650; }
  #panel .head .grow { flex: 1; }
  form#find { display: flex; gap: 6px; }
  #q { flex: 1; min-width: 0; padding: 8px 10px; font-size: 16px; }
  #panel button { font-size: 13.5px; padding: 6px 10px; }
  details.near { margin-top: 10px; }
  details.near > summary { cursor: pointer; color: var(--muted); font-size: 13.5px; list-style: none; }
  details.near > summary::-webkit-details-marker { display: none; }
  .cats { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  #results { list-style: none; margin: 8px 0 0; padding: 0; max-height: 42vh; overflow-y: auto; }
  #results li { padding: 7px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  #results li:hover, #results li:focus { background: var(--soft); outline: none; }
  #results small { color: var(--muted); display: block; font-size: 12.5px; }
  #note { margin-top: 8px; }
  #shelternote { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); font-size: 13px; }
  #shelternote[hidden] { display: none; }
  #shelternote p { margin: 0; }
  #shelternote p + p { margin-top: 6px; }
  #coords { margin-top: 8px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .bar { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
  .bar .grow { flex: 1; }
  #zoom { font-size: 12px; color: var(--muted); }
  #err { color: var(--red); margin-top: 6px; display: none; }
  #toggle { display: none; }
  .maplibregl-ctrl-group button.gps-btn { color: #1b1b1b; font-size: 19px; line-height: 1; padding: 0; border-radius: 0; }
  .maplibregl-ctrl-group button.gps-btn.on { background: #dbe9ff; }
  .gps-dot { width: 18px; height: 18px; border-radius: 50%; background: #1a73e8; border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(26,115,232,.35), 0 1px 4px rgba(0,0,0,.4); }
  @media (max-width: 520px) {
    #panel { left: 8px; right: 56px; width: auto; max-width: none; top: 8px; padding: 10px; }
    #panel.min .hide-min { display: none; }
    #toggle { display: inline-block; }
    #zoom { display: none; }
  }
</style>
</head>
<body data-switch="bottom">
<div id="map"></div>
<div id="panel">
  <div class="head"><a href="../">← <span data-kit></span></a><b data-t="map.title"></b><span class="grow"></span><span id="zoom"></span></div>
  <form id="find" autocomplete="off">
    <input id="q" data-t-attr="placeholder:map.search.placeholder;aria-label:map.search.label">
    <button type="submit" data-t="map.search.button"></button>
  </form>
  <div class="hide-min">
    <details class="near"><summary data-t="map.nearest.summary"></summary>
      <div class="cats" id="cats" data-t-attr="aria-label:map.nearest.label"></div>
    </details>
    <ul id="results"></ul>
    <div id="note"></div>
    <div id="shelternote" hidden></div>
    <div id="coords"></div>
  </div>
  <div class="bar">
    <span id="shortcuts" style="display: contents"></span>
    <span class="grow"></span>
    <button type="button" class="plain" id="toggle" data-t-attr="aria-label:map.panel.toggle">▾</button>
  </div>
  <div id="err"></div>
</div>
<script src="lib/maplibre-gl.js"></script>
<script src="lib/pmtiles.js"></script>
<script src="search.js"></script>
<script>
  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile);

  const base = new URL('.', location.href).href;
  // The title is "Map · Kit name" in the page language (set after country.js has written its own).
  const setTitle = () => { document.title = KIT.t('map.title') + ' · ' + COUNTRY.kit(); };
  addEventListener('DOMContentLoaded', () => { setTitle(); redraw.forEach(fn => fn()); });
  addEventListener('kitlang', setTitle);
  KIT.onChange(() => {
    redraw.forEach(fn => fn());
    if (resultsSrc && window.kitMap) show(resultsSrc.list, window.kitMap, resultsSrc.withDistance, resultsSrc.from, resultsSrc.fromKeyGiven);
  });
  const root = new URL('../tiles/', location.href).href;   // where the .pmtiles live
  const $ = s => document.querySelector(s);
  // Texts the script writes itself must follow the page language, so each is kept as a function and written
  // again when the language changes: the note under the search, the coordinates line, the result list, the
  // zoom, the error line and the nearest and shortcut buttons.
  let noteSrc = null, coordsSrc = null, errSrc = null, resultsSrc = null, shelterSrc = null;
  const redraw = [];
  const renderNote = () => {
    const v = noteSrc ? noteSrc() : '';
    $('#note').replaceChildren(typeof v === 'string' ? document.createTextNode(v) : v);
  };
  const note = src => { noteSrc = typeof src === 'string' ? () => src : src; renderNote(); };   // a text, or a function giving text (or nodes)
  redraw.push(renderNote);
  const showError = src => { errSrc = src; renderError(); };
  const renderError = () => {
    const el = $('#err');
    if (errSrc) { el.style.display = 'block'; el.textContent = errSrc(); }
  };
  redraw.push(renderError);

  // The shelter list always carries this note, in both languages, even when the list is empty or far away.
  // shelterSrc: null (not a shelter list) or { km, fromKey }: how far the nearest shelter on the map is, or km null for none.
  const renderShelter = () => {
    const el = $('#shelternote');
    el.hidden = !shelterSrc;
    if (!shelterSrc) { el.replaceChildren(); return; }
    const lines = [];
    lines.push(shelterSrc.km === null ? KIT.t('map.shelter.none')
      : KIT.t('map.shelter.nearest', { distance: KIT.t(shelterSrc.fromKey, { distance: fmtKm(shelterSrc.km) }) }));
    lines.push(KIT.t('map.shelter.note'));
    el.replaceChildren(...lines.map(t => { const p = document.createElement('p'); p.textContent = t; return p; }));
  };
  redraw.push(renderShelter);

  // A map file is usable only if it starts with the PMTiles magic bytes.
  const isReady = url => fetch(url, { headers: { Range: 'bytes=0-6' } })
    .then(r => r.ok ? r.text() : '').then(t => t === 'PMTiles').catch(() => false);

  // Zoom to use when jumping to a result of each type.
  const MAP = COUNTRY.map, LABELS = MAP.labels;   // the country's place types, labels and start view (country config)
  const ZOOM = MAP.zoom_by_type;
  const zoomFor = t => ZOOM[t] || 18;

  // ---------- place search (offline files made by scripts/build-map-index.py; the rules are in search.js) ----------
  // data/places.json: towns, villages and services for the whole country, always loaded.
  // data/letters/<a-z0-9>.json: streets, addresses and landmarks, by first letter of the transliterated name,
  // so a phone only loads the one small file it needs. Files are made ahead of time and come with each release.
  const SR = KitSearch, norm = SR.norm;
  let index = null;
  function loadIndex() {
    if (!index) index = fetch('data/places.json').then(r => r.json()).then(d => SR.prepare(d, LABELS.street).items).catch(() => []);
    return index;
  }
  const letters = {};
  function loadLetter(text) {
    const c = SR.letterOf(text);
    if (!letters[c]) letters[c] = fetch(`data/letters/${c}.json`).then(r => r.json()).then(d => SR.prepare(d, LABELS.street)).catch(() => ({ items: [], list: [], cities: [] }));
    return letters[c];
  }
  // What an entry is called and what kind it is, in the page language. A service without a name is called by its kind.
  const typeName = t => KIT.t(['map.type', t].join('.'));   // one text per kind, map.type.<kind> in the language files
  const nameOf = e => SR.displayName(e, KIT.lang, e.t ? typeName(e.t) : '');
  const km = SR.km;
  const fmtKm = d => d < 1 ? Math.round(d * 100) * 10 + ' ' + KIT.t('map.unit.m') : (d < 10 ? d.toFixed(1) : Math.round(d)) + ' ' + KIT.t('map.unit.km');

  function show(list, map, withDistance, from, fromKeyGiven) {
    resultsSrc = { list, withDistance, from, fromKeyGiven };   // kept to write the list again when the language changes
    const ul = $('#results');
    ul.innerHTML = '';
    const c = map.getCenter(), shown = [];
    const origin = from || [c.lng, c.lat], fromKey = fromKeyGiven || (from && gps.here && from === gps.here ? 'map.distance.fromyou' : 'map.distance.fromcentre');
    for (const e of list) {
      // the same place is often mapped twice (a point and a building): show it once
      if (shown.some(o => o[0] === e[0] && o.t === e.t && km([o[2], o[3]], [e[2], e[3]]) < 0.4)) continue;
      shown.push(e);
      const li = document.createElement('li');
      li.tabIndex = 0;
      const where = [kindOf(e), SR.displayArea(e.a, KIT.lang), withDistance ? KIT.t(fromKey, { distance: fmtKm(km([e[2], e[3]], origin)) }) : ''].filter(Boolean).join(' · ');
      li.innerHTML = '<b></b><small></small>';
      li.querySelector('b').textContent = nameOf(e);
      li.querySelector('small').textContent = where;
      const go = () => jump(map, e);
      li.onclick = go;
      li.onkeydown = ev => { if (ev.key === 'Enter') go(); };
      ul.appendChild(li);
    }
  }

  // "Pharmacy", or "Approximate position, between no. 20 and 24" for an address that is a guess
  const kindOf = e => e.approx ? KIT.t('map.search.between', e.approx) : typeName(e.t);

  let pin = null;
  function jump(map, e, label) {
    pin.setLngLat([e[2], e[3]]).addTo(map);
    map.flyTo({ center: [e[2], e[3]], zoom: label ? 18.5 : zoomFor(e.t), speed: 1.6 });
    setCoords(e[2], e[3], label || (() => nameOf(e) + (e.a ? ', ' + SR.displayArea(e.a, KIT.lang) : '')));
    if (matchMedia('(max-width: 520px)').matches) $('#panel').classList.add('min');
  }

  // Which neighbourhood a point is in, for addresses that do not name their town.
  let areaPlaces = null;
  function areaNear(items, pt) {
    areaPlaces = areaPlaces || items.filter(e => LABELS.area_types.includes(e.t));
    let best = '', bd = 3;
    for (const e of areaPlaces) { const d = km(pt, [e[2], e[3]]); if (d < bd) { bd = d; best = e[0]; } }
    return best;
  }

  // Addresses are local: rank by distance from the map (up to 100 km), then by the area typed.
  async function findAddress(map, q) {
    const [A, items] = await Promise.all([loadLetter(q.street), loadIndex()]);
    const c = map.getCenter();
    const list = SR.findAddress(A, items, q, { here: [c.lng, c.lat], address: LABELS.address, areaKinds: LABELS.area_types });
    list.forEach(e => { if (!e.a || /^\d+$/.test(e.a)) e.a = areaNear(items, [e[2], e[3]]); });
    return list;
  }

  // Search ranking: emergency places and towns first, bus stops last.
  const PRIO = MAP.search_priority;

  async function search(map, text) {
    note('');
    shelterSrc = null; renderShelter();
    const m = text.match(/^\s*(-?\d+(?:[.,]\d+)?)\s*[,; ]\s*(-?\d+(?:[.,]\d+)?)\s*$/);
    if (m) {  // coordinates: lat, lon
      const lat = parseFloat(m[1].replace(',', '.')), lng = parseFloat(m[2].replace(',', '.'));
      pin.setLngLat([lng, lat]).addTo(map);
      map.flyTo({ center: [lng, lat], zoom: Math.max(map.getZoom(), 15) });
      setCoords(lng, lat);
      $('#results').innerHTML = ''; resultsSrc = null;
      return;
    }
    let words = text, house = null;
    const hm = SR.parseQuery(text);   // "Хрещатик 22", "Садова 12-А, Львів"
    if (hm) {
      hm.area = SR.canonicalArea(await loadIndex(), hm.area, LABELS.area_types);   // "Киев" means Київ
      house = hm.number.replace(/\s/g, '').toUpperCase();
      const found = await findAddress(map, hm);
      if (found.length) {
        show(found, map, true);
        jump(map, found[0], () => `${nameOf(found[0])}${found[0].a ? ', ' + SR.displayArea(found[0].a, KIT.lang) : ''}`);
        const name = () => nameOf(found[0]);
        if (found[0].miss) note(() => KIT.t('map.search.areamiss', { name: name(), area: hm.area }));
        else if (found[0].approx) note(() => KIT.t('map.search.approximate', { name: name() }));
        return;
      }
      words = (hm.street + ' ' + hm.area).trim();
    }
    const [base, extra] = await Promise.all([loadIndex(), loadLetter(words)]);
    const items = base.concat(extra.items);
    if (!items.length) { note(() => KIT.t('map.search.missing')); return; }
    if (!norm(words)) return;
    const c = map.getCenter();
    const list = SR.searchItems(items, words, { prio: PRIO, here: [c.lng, c.lat], house: !!house, street: LABELS.street });
    if (!list.length) { $('#results').innerHTML = ''; resultsSrc = null; note(() => KIT.t('map.search.nothing')); return; }
    show(list, map, true);
    if (house && list[0].t === LABELS.street) { jump(map, list[0]); note(() => KIT.t('map.search.nonumber', { number: house })); }
  }

  // From the Kit Mac's position if there is one, else from the place marked on the map (a searched place, a
  // tap), else from the map centre. The same place is often mapped twice, so a list shows each place once.
  async function nearest(map, types) {
    note('');
    const items = await loadIndex();
    const want = new Set(types.split(','));
    const c = map.getCenter();
    let here = [c.lng, c.lat], fromKey = 'map.distance.fromcentre';
    if (gps.on && gps.here) { here = gps.here; fromKey = 'map.distance.fromyou'; }
    else if (pin && pin.getElement().isConnected) { const p = pin.getLngLat(); here = [p.lng, p.lat]; fromKey = 'map.distance.frompin'; }
    const sorted = items.filter(e => want.has(e.t)).map(e => [km([e[2], e[3]], here), e]).sort((a, b) => a[0] - b[0]);
    const list = [];
    for (const [, e] of sorted) {
      if (list.length >= 20) break;
      if (!list.some(o => o[0] === e[0] && km([o[2], o[3]], [e[2], e[3]]) < 0.4)) list.push(e);
    }
    shelterSrc = want.has(LABELS.shelter) ? { km: sorted.length ? sorted[0][0] : null, fromKey } : null;
    renderShelter();
    show(list, map, true, here, fromKey);
    if (!list.length && !shelterSrc) note(() => KIT.t('map.nearest.none'));
  }

  // label: a place name, or a function giving a text in the page language
  function setCoords(lng, lat, label) { coordsSrc = { lng, lat, label }; renderCoords(); }
  function renderCoords() {
    if (!coordsSrc) { $('#coords').textContent = KIT.t('map.coords.hint'); return; }
    const { lng, lat, label } = coordsSrc, name = typeof label === 'function' ? label() : label;
    $('#coords').textContent = (name ? name + ': ' : '') +
      `${lat.toFixed(5)}, ${lng.toFixed(5)}  (${Math.abs(lat).toFixed(4)}° ${KIT.t(lat >= 0 ? 'map.coords.north' : 'map.coords.south')} ${Math.abs(lng).toFixed(4)}° ${KIT.t(lng >= 0 ? 'map.coords.east' : 'map.coords.west')})`;
  }
  redraw.push(renderCoords);

  // ---------- where am I (GPS) ----------
  // First choice: a USB GPS receiver in the Mac, read by the kit's web server (/ai-api/gps).
  // Otherwise the browser's own location: a phone's GPS (on https), or a Mac with internet.
  const gps = {
    on: false, timer: null, here: null, centre: true, usb: false, watch: null, dot: null, btn: null,
    start(map) {
      this.on = true; this.centre = true; this.btn && this.btn.classList.add('on');
      $('#panel').classList.remove('min');
      note(() => KIT.t('map.gps.searching'));
      this.poll(map); this.timer = setInterval(() => this.poll(map), 2000);
    },
    stop() {
      this.on = false; clearInterval(this.timer); this.btn && this.btn.classList.remove('on');
      if (this.watch !== null) { navigator.geolocation.clearWatch(this.watch); this.watch = null; }
      note('');
    },
    click(map) {
      if (!this.on) return this.start(map);
      if (!this.centre && this.here) { this.centre = true; map.flyTo({ center: this.here, zoom: Math.max(map.getZoom(), 16) }); return; }
      this.stop();
    },
    async poll(map) {
      let g = { device: null };
      try { g = await (await fetch('/ai-api/gps', { cache: 'no-store' })).json(); } catch {}
      if (!this.on) return;
      this.usb = !!g.device;
      if (g.device && g.fix) {
        const acc = () => g.accuracy_m ? KIT.t('map.gps.accuracy', { metres: Math.round(g.accuracy_m) }) : '';
        const what = () => g.source === 'phone' ? KIT.t('map.gps.phone') : KIT.t('map.gps.receiver', { sats: g.sats || '?' });
        return this.show(map, g.lon, g.lat, g.accuracy_m, () => KIT.t('map.gps.here', { detail: what() + acc() }));
      }
      if (g.device) {
        return note(() => KIT.t('map.gps.searchingsats', { visible: g.sats_in_view ? KIT.t('map.gps.visible', { count: g.sats_in_view }) : '' }));
      }
      if (navigator.geolocation && window.isSecureContext) {
        if (this.watch === null) this.watch = navigator.geolocation.watchPosition(
          p => { if (!this.usb) this.show(map, p.coords.longitude, p.coords.latitude, p.coords.accuracy, () => KIT.t('map.gps.here', { detail: KIT.t('map.gps.accuracyonly', { metres: Math.round(p.coords.accuracy) }) })); },
          () => { if (!this.usb && !this.here) note(() => noGps()); },
          { enableHighAccuracy: true, timeout: 20000, maximumAge: 10000 });
        return;
      }
      if (!this.here) note(() => noGps());
    },
    show(map, lon, lat, acc, label) {
      this.here = [lon, lat];
      if (!this.dot) {
        const el = document.createElement('div'); el.className = 'gps-dot';
        this.dot = new maplibregl.Marker({ element: el }).setLngLat(this.here).addTo(map);
      } else this.dot.setLngLat(this.here);
      const ring = circle(lon, lat, Math.max(acc || 0, 3));
      if (map.getSource('gps-acc')) map.getSource('gps-acc').setData(ring);
      else {
        map.addSource('gps-acc', { type: 'geojson', data: ring });
        map.addLayer({ id: 'gps-acc', type: 'fill', source: 'gps-acc', paint: { 'fill-color': '#1a73e8', 'fill-opacity': 0.15 } });
      }
      if (this.centre) map.easeTo({ center: this.here, zoom: Math.max(map.getZoom(), 16), duration: 800 });
      setCoords(lon, lat, label);
      note('');
    },
  };
  // The "no GPS" message, with a link to the phone page (set up a phone's own GPS, and the Kit Mac's lending switch).
  const noGps = () => {
    const box = document.createDocumentFragment();
    box.append(KIT.t('map.gps.none'));
    const a = document.createElement('a');
    a.href = '/phone/'; a.textContent = KIT.t('map.gps.setup');
    box.append(' ', a);
    return box;
  };
  const circle = (lon, lat, m) => {
    const pts = [];
    for (let i = 0; i <= 48; i++) {
      const a = i / 48 * 2 * Math.PI;
      pts.push([lon + (m / (111320 * Math.cos(lat * Math.PI / 180))) * Math.cos(a), lat + (m / 110574) * Math.sin(a)]);
    }
    return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [pts] } };
  };
  class WhereAmI {
    constructor(map) { this.map = map; }
    onAdd() {
      const el = document.createElement('div');
      el.className = 'maplibregl-ctrl maplibregl-ctrl-group';
      el.innerHTML = '<button type="button" class="gps-btn">⌖</button>';
      gps.btn = el.querySelector('button');
      const words = () => { gps.btn.title = KIT.t('map.gps.title'); gps.btn.setAttribute('aria-label', KIT.t('map.gps.label')); };
      words(); redraw.push(words);
      gps.btn.onclick = () => gps.click(this.map);
      this.map.on('dragstart', () => { gps.centre = false; });
      return el;
    }
    onRemove() {}
  }

  // ---------- map ----------
  // Place names follow the page language: that language's name, else the place's own (local) name. One
  // language per label (the style as shipped has the same expression for the default language). A page
  // language without a name tag in the tiles simply falls back to the local name.
  const nameExpr = lang => ['coalesce', ['get', 'name:' + lang], ['get', 'name']];
  const labelField = (id, lang) => id.startsWith('places_region')   // regions show their short code at low zoom
    ? ['step', ['zoom'], ['coalesce', ['get', 'ref:en'], ['get', 'ref']], 6, nameExpr(lang)]
    : nameExpr(lang);
  const labelLayers = style => style.layers.filter(l => l.layout && JSON.stringify(l.layout['text-field'] || '').includes('"name"')).map(l => l.id);

  fetch('style.json').then(r => r.json()).then(async style => {
    const labels = labelLayers(style);
    style.layers.forEach(l => { if (labels.includes(l.id)) l.layout['text-field'] = labelField(l.id, KIT.lang); });
    style.sprite = base + 'assets/sprites/v4/light';
    style.glyphs = base + 'assets/fonts/{fontstack}/{range}.pbf';
    const missing = [];
    for (const [name, src] of Object.entries(style.sources)) {
      const url = root + (name === 'area' ? MAP.pmtiles : name) + '.pmtiles';   // 'area' is the country's detailed map file
      if (await isReady(url)) {
        src.url = 'pmtiles://' + url;
      } else {
        missing.push(name);
        delete style.sources[name];
        style.layers = style.layers.filter(l => l.source !== name);
      }
    }
    if (missing.length) showError(() => KIT.t('map.error.missing', { files: missing.map(n => (n === 'area' ? MAP.pmtiles : n) + '.pmtiles').join(', ') }));

    // Buttons for the country config's nearest categories and shortcuts (a town, the whole country).
    // Made before the map, so they are there even on a device that cannot draw it.
    for (const n of MAP.nearest) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'plain'; b.dataset.t = n.types.join(',');
      b.onclick = () => nearest(window.kitMap, b.dataset.t);
      redraw.push(() => { b.textContent = COUNTRY.text(n.label); });
      $('#cats').appendChild(b);
    }
    const shortcut = (label, center, zoom) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'plain';
      b.onclick = () => window.kitMap.flyTo({ center, zoom });
      redraw.push(() => { b.textContent = COUNTRY.text(label); });
      $('#shortcuts').appendChild(b);
    };
    MAP.shortcuts.forEach(s => shortcut(s.label, s.center, s.zoom));
    shortcut(MAP.overview_label, MAP.center, MAP.zoom);
    redraw.forEach(fn => fn());   // the buttons' texts now, before the map is made (a device that cannot draw it still gets them)

    const map = new maplibregl.Map({
      container: 'map',
      style,
      center: MAP.center,
      zoom: MAP.zoom,
      maxZoom: 20,       // the map data has full detail at 15; beyond that it is enlarged, down to single houses
      hash: true,
    });
    window.kitMap = map;
    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.addControl(new WhereAmI(map), 'top-right');
    if (new URLSearchParams(location.search).has('gps')) map.once('load', () => gps.start(map));
    map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');
    pin = new maplibregl.Marker({ color: '#d32f2f' });

    const zoomText = () => { $('#zoom').textContent = KIT.t('map.zoom', { zoom: map.getZoom().toFixed(1) }); };
    map.on('zoom', zoomText); redraw.push(zoomText);

    map.on('click', e => { pin.setLngLat(e.lngLat).addTo(map); setCoords(e.lngLat.lng, e.lngLat.lat); });

    $('#find').addEventListener('submit', e => { e.preventDefault(); const t = $('#q').value.trim(); if (t) search(map, t); });
    $('#q').addEventListener('focus', () => { loadIndex(); $('#panel').classList.remove('min'); });
    $('#q').addEventListener('input', () => { if ($('#q').value.trim()) loadLetter($('#q').value); });   // fetch while typing
    $('#toggle').onclick = () => $('#panel').classList.toggle('min');
    if (matchMedia('(max-width: 520px)').matches) $('#panel').classList.add('min');   // phones: more map, less panel

    map.on('error', e => {
      const why = e.error && e.error.message || e.error;
      showError(() => KIT.t('map.error.map', { message: why || KIT.t('map.error.unknown') }));
    });

    // The language switch: labels on the map, then every text this page wrote itself.
    const setLabels = () => labels.forEach(id => { if (map.getLayer(id)) map.setLayoutProperty(id, 'text-field', labelField(id, KIT.lang)); });
    KIT.onChange(setLabels);
    redraw.forEach(fn => fn());
  });
</script>
</body>
</html>
