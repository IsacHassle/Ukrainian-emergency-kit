<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="/lib/country.js"></script>
<script src="/lib/lang.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{kit}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#0b5cad">
<link rel="stylesheet" href="../lib/kit.css">
<style>
  .page { max-width: 680px; }
  .box { margin: 18px 0; padding: 14px 16px; background: var(--soft); border-radius: 8px; }
  .box h2 { text-transform: none; letter-spacing: 0; font-size: 16px; color: var(--fg); margin: 0 0 8px; }
  ol { padding-left: 20px; } li { margin: 8px 0; }
  .note { font-size: 14px; color: var(--muted); }
  code { word-break: break-all; font-size: 14px; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  details.more { border-top: 1px solid var(--line); }
  details.more:last-of-type { border-bottom: 1px solid var(--line); }
  details.more > summary { list-style: none; cursor: pointer; padding: 14px 0; display: flex; justify-content: space-between; font-weight: 600; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::after { content: "+"; color: var(--muted); font-weight: 400; }
  details.more[open] > summary::after { content: "–"; }
  details.more > .inner { padding: 0 0 18px; }
</style>
</head>
<body>
<main class="page">
  <a class="back" href="/map/">← <span data-t="phone.back"></span></a>
  <h1 data-t="phone.title"></h1>
  <p class="meta" data-t="phone.intro"></p>

  <div class="box done" id="ready" hidden>
    <h2 data-t="phone.ready.title"></h2>
    <p data-t="phone.ready.text"></p>
  </div>

  <div class="box" id="lending">
    <h2 data-t="phone.lending.title"></h2>
    <p id="lendingstate"></p>
    <button type="button" id="lendingbtn" hidden></button>
    <p class="note" id="lendingnote"></p>
  </div>

  <div class="box" id="share" hidden>
    <h2 data-t="phone.share.title"></h2>
    <p data-t="phone.share.text"></p>
    <button type="button" id="sharebtn"></button>
    <p class="note" id="sharestatus"></p>
  </div>

  <div id="setup">
    <details class="more"><summary data-t="phone.ios.title"></summary><div class="inner">
      <ol>
        <li><a class="button" href="/ca.crt" data-t="phone.cert.get"></a><br><span data-t="phone.ios.step1"></span></li>
        <li data-t="phone.ios.step2"></li>
        <li id="iosstep3"></li>
        <li><a class="https" href="#"><code class="https-text"></code></a><br><span data-t="phone.ios.step4"></span></li>
      </ol>
    </div></details>
    <details class="more"><summary data-t="phone.android.title"></summary><div class="inner">
      <ol>
        <li><a class="button" href="/ca.crt" data-t="phone.cert.get"></a></li>
        <li id="andstep2"></li>
        <li><a class="https-ip" href="#"><code class="https-ip-text"></code></a><br><span data-t="phone.android.step3"></span></li>
      </ol>
    </div></details>
    <p class="note" data-t="phone.cert.note"></p>
    <p class="box" id="nocert" hidden data-t="phone.nocert"></p>
  </div>

  <h2 style="margin-top:32px" data-t="phone.without.title"></h2>
  <p data-t="phone.without.text"></p>
</main>
<script>
(() => {
  const ready = window.isSecureContext;   // https, or localhost
  document.getElementById('ready').hidden = !ready;
  document.getElementById('share').hidden = !ready;
  const $ = id => document.getElementById(id);
  const btn = $('sharebtn'), msg = $('sharestatus');
  let watch = null, lock = null;
  let lending = { on: false, kit_mac: false };   // what the Kit Mac says
  let lastMsg = null;                            // the status line as a function, so a language change redraws it
  const say = fn => { lastMsg = fn; msg.textContent = fn ? fn() : ''; };
  let server = {};                               // /ai-api/status

  // Everything the page writes itself, redrawn when the language changes.
  const render = () => {
    const root = document.documentElement;
    root.dataset.title = KIT.t('phone.pagetitle');
    document.title = root.dataset.title.split('{kit}').join(COUNTRY.kit());
    btn.textContent = watch !== null ? KIT.t('phone.share.stop') : KIT.t('phone.share.start');
    btn.disabled = watch === null && !lending.on;
    $('lendingstate').textContent = KIT.t(lending.on ? 'phone.lending.on' : 'phone.lending.off');
    const lb = $('lendingbtn');
    lb.hidden = !lending.kit_mac;
    lb.textContent = KIT.t(lending.on ? 'phone.lending.turnoff' : 'phone.lending.turnon');
    $('lendingnote').textContent = lending.kit_mac ? KIT.t('phone.lending.keepernote') : (lending.on ? '' : KIT.t('phone.lending.visitornote'));
    const name = server.name ? server.name.replace(/\.local$/, '') : '';
    $('iosstep3').textContent = KIT.t('phone.ios.step3', { kit: COUNTRY.kit(), name: name || location.hostname });
    $('andstep2').textContent = KIT.t('phone.android.step2', { file: COUNTRY.slug + '.crt' });
    if (lastMsg) msg.textContent = lastMsg();
  };

  const readLending = () => fetch('/ai-api/lending', { cache: 'no-store' }).then(r => r.json()).then(s => {
    lending = s;
    if (!s.on && watch !== null) stopSharing();
    render();
  }).catch(() => {});
  $('lendingbtn').onclick = () => {
    fetch('/ai-api/lending', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ on: !lending.on }) })
      .then(r => r.json()).then(s => { if (s.on !== undefined) { lending = s; if (!s.on && watch !== null) stopSharing(); render(); } })
      .catch(() => {});
  };

  const keepAwake = async () => { try { lock = await navigator.wakeLock.request('screen'); } catch {} };
  document.addEventListener('visibilitychange', () => { if (watch !== null && document.visibilityState === 'visible') keepAwake(); });
  function stopSharing() {
    if (watch !== null) navigator.geolocation.clearWatch(watch);
    watch = null;
    if (lock) lock.release().catch(() => {});
    render();
  }
  btn.onclick = () => {
    if (watch !== null) { stopSharing(); say(() => KIT.t('phone.share.stopped')); return; }
    say(() => KIT.t('phone.share.searching'));
    watch = navigator.geolocation.watchPosition(p => {
      fetch('/ai-api/gps-share', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lat: p.coords.latitude, lon: p.coords.longitude, accuracy: p.coords.accuracy }) })
        .then(async r => {
          if (r.status === 403) {   // lending is turned off: say why instead of failing quietly
            stopSharing(); readLending();
            say(() => KIT.t('phone.share.refused'));
            return;
          }
          if (!r.ok) throw 0;
          const at = new Date().toLocaleTimeString(KIT.locale);
          say(() => KIT.t('phone.share.sharing', { metres: Math.round(p.coords.accuracy), time: at }));
        })
        .catch(() => say(() => KIT.t('phone.share.unreachable')));
    }, err => {
      say(() => err.code === 1 ? KIT.t('phone.share.denied') : KIT.t('phone.share.searching'));
    }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 60000 });
    render();
    keepAwake();
  };

  fetch('/ai-api/status').then(r => r.json()).then(s => {
    server = s;
    const port = s.https_port || 8443;
    const name = s.name || location.hostname;
    const byName = `https://${name}:${port}/map/`, byIp = `https://${s.lan || location.hostname}:${port}/map/`;
    document.querySelectorAll('a.https').forEach(a => a.href = byName);
    document.querySelectorAll('.https-text').forEach(c => c.textContent = byName);
    document.querySelectorAll('a.https-ip').forEach(a => a.href = byIp);
    document.querySelectorAll('.https-ip-text').forEach(c => c.textContent = byIp);
    $('nocert').hidden = !!s.https_port;
    render();
  }).catch(() => {});

  KIT.onChange(render);
  render();
  readLending();
  setInterval(readLending, 5000);   // the Keeper may turn lending on or off while this page is open
})();
</script>
</body>
</html>
