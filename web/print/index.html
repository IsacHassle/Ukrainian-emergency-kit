<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<script src="/lib/country.js"></script>
<script src="/lib/lang.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Друк · {kit}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-title" content="" data-kit-attr="content={kit}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b5cad">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%96%A8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../lib/kit.css">
<style>
  * { box-sizing: border-box; }

  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  a { color: var(--accent); }
  .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom: 12px; }
  .bar a { text-decoration:none; }

  .sub { color: var(--muted); }
  section { border-top: 1px solid var(--line); padding: 6px 0 14px; margin: 18px 0; }
  section h1 { font-size: 22px; margin: 14px 0 6px; } h4 { font-size: 17px; margin: 16px 0 4px; }
  ul, ol { padding-left: 22px; } li { margin: 2px 0; }
  table { border-collapse: collapse; } td, th { border:1px solid var(--line); padding: 3px 6px; text-align:left; vertical-align: top; }
  .src { color: var(--muted); font-size: 13px; }
  .cover h1 { font-size: 30px; }
  .nums { font-size: 20px; line-height: 1.8; }
  .toc { columns: 2; font-size: 15px; }
  @media print {
    @page { size: A4; margin: 14mm; }
    body { background: #fff; color: #000; font-size: 10.5pt; line-height: 1.38; }
    main { max-width: none; padding: 0; }
    .bar, .noprint, .back, main > h1 { display: none; }
    body { font-size: 9.5pt; line-height: 1.32; }
    section { border: 0; padding: 0; margin: 0; break-before: page; column-count: 2; column-gap: 8mm; }
    section.cover { break-before: auto; column-count: 1; }
    section h1, section .src { column-span: all; }
    h1 { font-size: 15pt; margin: 0 0 4pt; } h4 { font-size: 11pt; margin: 8pt 0 2pt; break-after: avoid; }
    p, ul, ol { margin: 3pt 0; } li { break-inside: avoid; }
    .nums { font-size: 15pt; }
    .src { color: #444; }
  }
</style>
</head>
<main class="page">
  <a class="back" href="/">← <span data-kit></span></a>
  <h1 data-t="print.title"></h1>
  <div class="bar" style="margin-top:14px"><button onclick="print()" data-t="print.now"></button></div>
  <p class="sub noprint" data-t="print.guides.intro"></p>
  <div id="pack"><p data-t="print.loading"></p></div>
</main>
<script src="../lib/md.js"></script>
<script>
(() => {
  const DIR = 'docs/' + COUNTRY.official_guides.folder + '/';
  // On paper, keep what to do and leave out page furniture: a heading that matches one of the country config's
  // print_skip patterns is dropped with everything under it (up to the next heading of the same or higher level).
  const SKIP = COUNTRY.official_guides.print_skip.map(p => new RegExp(p, 'i'));
  // print_drop_lines are single lines that never print: the site's navigation tags ("## Resistance", "#Medicine").
  const DROP = COUNTRY.official_guides.print_drop_lines.map(p => new RegExp(p));
  const trim = md => {
    const out = []; let skipLevel = 0;
    for (const line of md.split('\n')) {
      if (DROP.some(r => r.test(line))) continue;
      const h = line.match(/^(#{1,6})\s+(.*)/);
      if (h) {
        if (skipLevel && h[1].length > skipLevel) continue;
        skipLevel = (h[1].length > 1 && SKIP.some(r => r.test(h[2].trim()))) ? h[1].length : 0;
      }
      if (!skipLevel) out.push(line);
    }
    return out.join('\n');
  };
  // The emergency numbers, two to a line: "<b>112</b> all emergencies · <b>101</b> fire and rescue<br>...".
  const numbers = () => COUNTRY.emergency_numbers.map(n => `<b>${n.number}</b> ${COUNTRY.text(n.print_label)}`)
    .map((t, i, all) => i % 2 ? t + (i < all.length - 1 ? '<br>' : '') : t + (i < all.length - 1 ? ' \u00b7 ' : '')).join('');
  // The guides that go on paper in the page language: Ukrainian ones sit in the guides folder, the others in a
  // folder named by language code (where the guide saver puts them).
  const pagesFor = lang => (COUNTRY.official_guides.print_pages[lang] || COUNTRY.official_guides.print_pages[COUNTRY.default_language]);
  const folderFor = lang => DIR + (lang === COUNTRY.default_language ? '' : lang + '/');
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  let drawn = 0;
  function draw() {
    const lang = KIT.lang, mine = ++drawn;
    document.documentElement.dataset.title = KIT.t('print.title') + ' \u00b7 {kit}';
    document.title = KIT.t('print.title') + ' \u00b7 ' + COUNTRY.kit();
    const today = new Date().toLocaleDateString(KIT.locale);
    const names = pagesFor(lang);
    Promise.all(names.map(p => fetchDoc(folderFor(lang) + p + '.md').then(t => renderMarkdown(trim(t))).catch(() => null))).then(docs => {
      if (mine !== drawn) return;
      const ok = docs.map((d, i) => d && { ...d, name: names[i] }).filter(Boolean);
      // Both names of the kit are on the paper, whichever language it is printed in.
      const both = [lang, ...Object.keys(COUNTRY.kit_name).filter(l => l !== lang)].map(l => COUNTRY.kit_name[l]).filter(Boolean).join(' / ');
      let html = `<section class="cover"><h1>${esc(both)}</h1>
        <p class="nums">${numbers()}<br>${KIT.t('print.cover.radio', { radio: COUNTRY.text(COUNTRY.radio.print_label) })}</p>
        <p>${KIT.t('print.cover.saved', { date: today })}</p>
        <h4>${KIT.t('print.cover.contents')}</h4><ol class="toc">${ok.map(d => `<li>${esc(d.title || d.name.split(' - ')[1])} <span class="src">(${esc(d.name.split(' - ')[0])})</span></li>`).join('')}</ol></section>`;
      html += ok.map(d => `<section>${d.html}</section>`).join('');
      if (!ok.length) html = '<p>' + KIT.t('print.guides.missing') + '</p>';
      document.getElementById('pack').innerHTML = html;
    });
  }
  KIT.onChange(draw);
  draw();
})();
</script>
</body>
</html>
