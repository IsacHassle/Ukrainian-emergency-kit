<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="/lib/country.js"></script>
<script src="/lib/lang.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{kit}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-title" content="" data-kit-attr="content={kit}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b5cad">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9B%91%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../lib/kit.css">
<style>
  .page { max-width: 700px; }
  .tools { display: flex; gap: 8px; margin: 0 0 18px; align-items: center; }
  .tools .grow { flex: 1; }
  article { font-size: 18px; line-height: 1.6; }
  article h1 { font-size: 28px; line-height: 1.2; margin: 0 0 6px; }
  article h4 { font-size: 19px; margin: 28px 0 6px; }
  article ul, article ol { padding-left: 24px; } article li { margin: 4px 0; }
  article table { border-collapse: collapse; font-size: 16px; display: block; overflow-x: auto; }
  article td, article th { border-bottom: 1px solid var(--line); padding: 4px 8px 4px 0; text-align: left; vertical-align: top; }
  .src { color: var(--muted); font-size: 13px; }
  .err { color: var(--red); }
  @media print { .tools, .emergency { display: none; } }
</style>
</head>
<body>
<main class="page">
  <div class="tools"><a class="back" style="margin:0" href="/">← <span data-kit></span></a><span class="grow"></span><a class="button plain" href="../ai/" data-t="reader.ask"></a><a class="button plain" href="#" onclick="print(); return false" data-t="reader.print"></a></div>
  <article id="doc"><p data-t="reader.loading"></p></article>
</main>
<script src="../lib/escape.js"></script>
<script src="../lib/md.js"></script>
<script>
(() => {
  // Shows a saved text document (Markdown) from documents/, for reading without internet. The page around the text
  // follows the page language; the guide itself is in the language it was saved in (one in the country's own language in the folder,
  // an English one in its en/ subfolder), and the start page only links the guides of the page language.
  const f = new URLSearchParams(location.search).get('f') || '';
  const box = document.getElementById('doc');
  let state = 'loading', doc = null;   // what the box shows, so it can be written again when the language changes
  const show = () => {
    if (state === 'doc') {
      box.innerHTML = doc.html;
      document.title = (doc.title ? doc.title + ' · ' : '') + COUNTRY.kit();
    } else if (state !== 'loading') {
      box.innerHTML = '<p class="err">' + (state === 'unknown' ? KIT.t('reader.error.unknown') : KIT.t('reader.error.missing')) + '</p>';
    }
  };
  if (!/^docs\/[^?#]+\.(md|txt)$/.test(f) || f.includes('..')) { state = 'unknown'; show(); }
  else {
    fetchDoc(f)
      .then(t => { doc = renderMarkdown(t); state = 'doc'; show(); })
      .catch(() => { state = 'missing'; show(); });
  }
  KIT.onChange(show);
})();
</script>
</body>
</html>
